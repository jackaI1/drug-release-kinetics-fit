name: Tests and reproducible report
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv build
      - run: uv run release-fit data/ketoprofen_f15.csv --metadata data/ketoprofen_f15.json --output reports/ketoprofen --bootstrap 500 --seed 2026
      - run: uv run python scripts/summary.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-report-python-${{ matrix.python }}
          path: reports/ketoprofen/
